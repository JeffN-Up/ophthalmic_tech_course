# Payment-free Spindel Eye Associates onboarding release.
# The deployable application is unpacked from the validated release package in /release.
services:
  - type: web
    name: spindel-eye-onboarding
    runtime: node
    plan: starter
    region: ohio
    buildCommand: rm -rf .render-release && mkdir -p .render-release && cat release/source.b64.part* | base64 --decode | tar -xz -C .render-release && cd .render-release && corepack enable && corepack prepare pnpm@10.4.1 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: cd .render-release && node dist/index.js
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_URL
        fromService:
          type: web
          name: spindel-eye-onboarding
          envVarKey: RENDER_EXTERNAL_URL
      - key: ENABLE_PAID_ENROLLMENT
        value: "false"
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: SPINDEL_ACCESS_CODE
        sync: false
      - key: DATA_FILE
        value: /var/data/course-data.json
    disk:
      name: spindel-onboarding-data
      mountPath: /var/data
      sizeGB: 1
