services:
  - type: web
    name: optitech-academy
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    disk:
      name: course-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/course-data.json
      - key: BUSINESS_NAME
        value: OptiTech Academy
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://optitech-academy.onrender.com
      - key: STRIPE_ALLOW_PROMOTION_CODES
        value: "true"
      - key: STRIPE_AUTOMATIC_TAX
        value: "false"
      - key: SPINDEL_MANAGER_FIRST_NAME
        value: Spindel
      - key: SPINDEL_MANAGER_LAST_NAME
        value: Administrator
      - key: SPINDEL_SEAT_LIMIT
        value: "100"

